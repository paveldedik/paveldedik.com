name: Deploy to Cloudflare Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-root
  cancel-in-progress: false

jobs:
  # One job per site directory. A new subdomain gets its own job (and its own
  # Pages project) next to this one.
  root:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: root
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: root/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build with Astro
        run: npm run build

      # Direct upload: Terraform (terraform/root) owns the Pages project and the
      # domain, this only pushes the artifact. --branch must match the project's
      # production_branch, otherwise the upload lands as a preview deployment.
      - name: Deploy to Cloudflare Pages
        run: npx wrangler@4 pages deploy dist --project-name=paveldedik --branch=master
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
