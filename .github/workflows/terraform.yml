name: Terraform

# Runs only when the infrastructure changes. A pull request gets a plan; a push
# to master applies it. Content changes never trigger this (see deploy.yml).
on:
  push:
    branches: [master]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:

permissions:
  contents: read

# The R2 state backend has no locking, so never let two runs overlap.
concurrency:
  group: terraform
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  TF_VAR_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  # The zone ID is an identifier, not a secret — same value as in .env.
  TF_VAR_zone_id: 7315f82ec9d83022dcaede54d2cff3cb
  # R2 S3 keypair for the state backend.
  AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

jobs:
  # Every directory under terraform/ is one module with its own state, so a new
  # hostname is picked up here without editing this file.
  modules:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.find.outputs.list }}
    steps:
      - uses: actions/checkout@v4
      - id: find
        run: echo "list=$(ls -d terraform/*/ | xargs -n1 basename | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"

  terraform:
    needs: modules
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        module: ${{ fromJson(needs.modules.outputs.list) }}
    defaults:
      run:
        working-directory: terraform/${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.3"

      - name: Format check
        run: terraform fmt -check

      # Same endpoint the gitignored backend.hcl supplies locally.
      - name: Init
        run: >
          terraform init
          -backend-config="endpoints={s3=\"https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com\"}"

      - name: Validate
        run: terraform validate

      # An unchanged module plans to "No changes", so applying every module on
      # each run is safe and keeps the workflow free of per-module path logic.
      - name: Plan
        run: terraform plan -out=tfplan

      - name: Apply
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        run: terraform apply tfplan
